# Server Configuration
server.port=8080
server.servlet.context-path=/api

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://postgres-db:5432/shopshield
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=backend

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JWT Configuration
app.jwt.secret=shopshield-super-secret-jwt-key-that-is-very-long-and-secure-2024
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://frontend:80

# Microservice URLs
microservice.ocr.url=http://ocr-service:8000
microservice.cv.url=http://cv-service:8001

# API Keys (move to environment variables in production)
app.api.google-vision-key=${GOOGLE_VISION_API_KEY:}
app.api.gemini-key=${GEMINI_API_KEY:AIzaSyDfzFKOYj-GT8jRhbA5E6jMS_KvSbsRW3A}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Logging Configuration
logging.level.com.example.shopshield=DEBUG
logging.level.org.springframework.security=DEBUG